<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸿蒙 PC 项目模板</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; }  /* 无边框窗口：页面必须自己铺满，别留白边 */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box; padding-top: 36px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f5f7fa; color: #1f2937;
    }
    /* ★ 无边框窗口的自绘标题栏：drag 区域负责拖动窗口（与 Windows 版行为一致） */
    .titlebar {
      position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 0 14px; background: #e8ecf3; color: #374151;
      -webkit-app-region: drag; user-select: none; font-size: 13px;
    }
    .titlebar .title { font-weight: 600; }
    .titlebar .controls { display: flex; -webkit-app-region: no-drag; height: 100%; }
    .titlebar .controls button {
      width: 46px; height: 100%; border: none; background: transparent;
      color: inherit; font-size: 14px; cursor: pointer;
    }
    .titlebar .controls button:hover { background: rgba(0,0,0,0.08); }
    .titlebar .controls button.close:hover { background: #e81123; color: #fff; }
    @media (prefers-color-scheme: dark) {
      .titlebar { background: #1f2937; color: #d1d5db; }
      .titlebar .controls button:hover { background: rgba(255,255,255,0.12); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
    }
    .card {
      background: rgba(255,255,255,0.85); border-radius: 16px; padding: 40px 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 640px; width: 90%;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) { .card { background: rgba(31,41,55,0.9); } }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .sub { opacity: 0.7; font-size: 14px; margin-bottom: 28px; }
    .status-row { display: flex; gap: 12px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
    .chip {
      border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 600;
      background: #e5e7eb; color: #374151;
    }
    .chip.ok { background: #d1fae5; color: #065f46; }
    .chip.fail { background: #fee2e2; color: #991b1b; }
    .btn {
      margin-top: 12px; border: none; border-radius: 10px; padding: 10px 24px;
      background: #2563eb; color: #fff; font-size: 15px; cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    pre {
      text-align: left; background: #0f172a; color: #a5f3fc; padding: 16px; border-radius: 10px;
      font-size: 13px; overflow: auto; min-height: 60px; margin-top: 16px;
    }
    .env { font-size: 13px; opacity: 0.75; margin-top: 24px; line-height: 1.8; text-align: left; }
    /* 平台能力面板（配合 ipc/process-manage.js 的参考实现） */
    .pm-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
    .btn.small { margin-top: 0; padding: 7px 14px; font-size: 13px; }
    .btn[disabled] { background: #9ca3af; cursor: not-allowed; opacity: .7; }
    .btn[disabled]::after { content: '（本平台不支持）'; font-size: 11px; }
  </style>
</head>
<body>
  <!-- ★ 无边框窗口的自绘标题栏：拖动区域 = .titlebar（-webkit-app-region: drag），三键 = preload 注入的 window.desktop -->
  <div class="titlebar">
    <span class="title">鸿蒙 PC 项目模板</span>
    <div class="controls">
      <button id="win-min" title="最小化">─</button>
      <button id="win-max" title="最大化/还原">□</button>
      <button id="win-close" class="close" title="关闭">✕</button>
    </div>
  </div>

  <div class="card">
    <h1>鸿蒙 PC 项目模板</h1>
    <div class="sub">Electron 前端 + Java 后端 · 链路自检页</div>

    <div class="status-row">
      <span class="chip" id="chk-frontend">前端页面 ✅</span>
      <span class="chip" id="chk-origin">页面 origin ?</span>
      <span class="chip" id="chk-redirect">域名映射 ?</span>
      <span class="chip" id="chk-backend">后端服务 ?</span>
    </div>

    <div class="status-row" style="align-items:center">
      <span style="font-size:14px">调用地址：</span>
      <code style="font-size:13px" id="api-url"></code>
    </div>

    <button class="btn" id="btn-ping">测试后端连通（/api/ping）</button>
    <button class="btn" id="btn-hello" style="background:#059669">请求后端接口（/api/hello）</button>
    <button class="btn" id="btn-echo" style="background:#7c3aed">POST 回显（/api/echo）</button>

    <pre id="output">点击上方按钮，观察后端响应…</pre>

    <!-- ★ 平台与能力面板：演示"能力驱动 UI"——不支持的按钮自动置灰，而不是点了没反应 -->
    <div class="status-row" style="margin-top:24px">
      <span class="chip" id="chk-platform">平台 ?</span>
      <span class="chip" id="chk-rawplatform">process.platform ?</span>
    </div>
    <div class="pm-row">
      <button class="btn small" data-cap="openPath" id="pm-open">打开用户目录</button>
      <button class="btn small" data-cap="taskbarVisible" id="pm-taskbar">隐藏任务栏图标</button>
      <button class="btn small" data-cap="flashFrame" id="pm-flash">闪烁窗口</button>
      <button class="btn small" data-cap="jumpList" id="pm-jump">设置跳转列表</button>
      <button class="btn small" data-cap="autoStart" id="pm-autostart">开机自启</button>
    </div>
    <pre id="pm-output">平台能力面板：点击按钮调用 ipc/process-manage.js 里的 handler…</pre>

    <div class="env" id="env"></div>
  </div>

  <script>
    // ============ 前端配置 ============
    // 与 main.js CONFIG.VIRTUAL_DOMAIN 保持一致；
    // 主进程 webRequest 会把该域名的请求重定向到 127.0.0.1:8080
    const API_BASE = 'http://app.localhost';

    const $ = (id) => document.getElementById(id);
    $('api-url').textContent = API_BASE;

    function setChip(id, text, ok) {
      const el = $(id);
      el.textContent = text;
      el.className = 'chip ' + (ok ? 'ok' : 'fail');
    }

    async function callApi(path, options) {
      const res = await fetch(API_BASE + path, options);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    }

    async function run(label, fn) {
      $('output').textContent = label + ' …';
      try {
        const text = await fn();
        $('output').textContent = '✅ ' + label + '\n' + text;
        return true;
      } catch (e) {
        $('output').textContent = '❌ ' + label + '\n' + e.message;
        return false;
      }
    }

    $('btn-ping').onclick = () => run('GET /api/ping', () => callApi('/api/ping'));
    $('btn-hello').onclick = () => run('GET /api/hello', () => callApi('/api/hello'));
    $('btn-echo').onclick = () => run('POST /api/echo', () => callApi('/api/echo', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: 'hello from renderer'
    }));

    // ============ 自绘标题栏三键（无边框窗口，见 main.js CONFIG.WINDOW.frame） ============
    (() => {
      const api = window.desktop;   // 由 preload.js 注入（contextIsolation: true）
      if (!api) {                   // 用浏览器直接打开本页时：隐藏三键
        const c = document.querySelector('.titlebar .controls');
        if (c) c.style.display = 'none';
        return;
      }
      $('win-min').onclick = () => api.minimize();
      $('win-max').onclick = () => api.toggleMaximize();
      $('win-close').onclick = () => api.close();
    })();

    // ============ 启动自检：ping 后端（域名映射生效则说明链路通） ============
    (async () => {
      // ★ origin 自检：file:// 页面的 Origin 是 null，带 Cookie 的跨域/登录请求必然失败
      const origin = location.origin;
      const originOk = !(origin === 'null' || origin.startsWith('file:'));
      setChip('chk-origin', originOk ? '真实 origin ✅' : 'origin=null ⚠️', originOk);

      setChip('chk-redirect', '域名映射 检测中', true);
      const ok = await run('链路自检 GET /api/ping（经 app.localhost 重定向）', () => callApi('/api/ping'));
      setChip('chk-backend', ok ? '后端服务 ✅' : '后端服务 ❌（未启动）', ok);
      setChip('chk-redirect', ok ? '域名映射 ✅' : '域名映射 ?', ok);
      $('env').textContent =
        '运行环境信息：\n' +
        '  userAgent: ' + navigator.userAgent + '\n' +
        '  平台: ' + navigator.platform + ' / 内核: ' + (navigator.userAgent.match(/Chrome\/([\d.]+)/) || [])[1] +
        ' / Electron: ' + (navigator.userAgent.match(/Electron\/([\d.]+)/) || [])[1] + '\n' +
        '  origin: ' + origin + (originOk
          ? '（真实 origin：跨域请求可按 Origin 精确放行）'
          : '  ⚠️ file:// 页面的 Origin 为 null，带 Cookie 的跨域/登录请求会被判失败\n' +
            '     解法：main.js 置 CONFIG.USE_APP_SCHEME=true（app:// 协议）或改用 http://app.localhost 加载页面\n' +
            '     详见《鸿蒙PC迁移专项_窗口全屏与跨域登录方案.md》§2.3');
    })();

    // ============ 平台与能力面板：能力驱动 UI（不支持的按钮置灰，而不是点了没反应） ============
    (async () => {
      const api = window.api;   // preload.js 注入（对应 ipc/process-manage.js 的通道）
      if (!api) {               // 用浏览器直接打开本页时：隐藏整个面板
        document.querySelectorAll('.pm-row, #pm-output').forEach((el) => { el.style.display = 'none'; });
        return;
      }

      const pmOut = (text) => { $('pm-output').textContent = text; };

      // 1) 平台信息
      try {
        const info = await api.info();
        setChip('chk-platform', '平台 ' + info.platform, true);
        setChip('chk-rawplatform', 'process.platform=' + info.rawPlatform, true);
        pmOut('平台信息：\n' + JSON.stringify(info, null, 2));
      } catch (e) {
        setChip('chk-platform', '平台信息 ❌ ' + e.code, false);
      }

      // 2) 能力探测 → 置灰不支持的按钮
      let caps = {};
      try { caps = await api.capabilities(); } catch (e) { pmOut('能力探测失败：' + e.message); }
      document.querySelectorAll('[data-cap]').forEach((btn) => {
        const cap = btn.dataset.cap;
        if (cap && caps[cap] === false) btn.disabled = true;
      });

      // 3) 调用：失败（含运行期 E_UNSUPPORTED）→ 立即置灰，避免反复点
      const actions = {
        'pm-open': () => api.openPath('.'),
        'pm-taskbar': () => api.setTaskbarVisible(false),
        'pm-flash': () => api.flashFrame(true),
        'pm-jump': () => api.setJumpList(),
        'pm-autostart': () => api.setAutoStart(true),
      };
      Object.entries(actions).forEach(([id, fn]) => {
        const btn = $(id);
        if (!btn) return;
        btn.onclick = async () => {
          pmOut('调用中… ' + id);
          try {
            const data = await fn();
            pmOut('✅ ' + id + ' 成功\n' + JSON.stringify(data ?? null, null, 2));
          } catch (e) {
            // 关键：能力以"运行时结果"为准——接口存在但调用抛错时，这里直接置灰
            if (e.code === 'E_UNSUPPORTED') btn.disabled = true;
            pmOut('❌ ' + id + ' 失败 [' + e.code + '] ' + e.message);
          }
        };
      });
    })();
  </script>
</body>
</html>
